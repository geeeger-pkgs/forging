<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Forging 是一款纯前端单机放置游戏：挖掘矿石、熔炼铸锭、锻造装备、强化精进，最终以传承换取永久精通加成。离线收益、可安装 PWA。"
    />
    <meta name="theme-color" content="#080a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forging" />
    <!-- v3.7：游戏感字体（拉丁/数字；中文自动回退系统字体）。离线时优雅回退，不阻塞渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <!-- v3.7.13：PWA 资源用**相对路径**引用 —— Vite 会按 base 重写，
         根路径部署与 GitHub Pages 子路径部署（/<repo>/）都能正确解析 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Forging · 挖矿锻造放置游戏</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
